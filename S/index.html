<!DOCTYPE html>
<!--Definem a estrutura inicial da página e o idioma como português do Brasil (pt-br)-->
<html lang="pt-br">
<head>
    <!--Contém as configurações invisíveis da página-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge";>
    <!--'Meta': configura acentuação e responsividade-->
    <title>CSS_InLine</title>
        <!--Define o título que aparece na aba do navegador-->
    <style>
        H1{
            color: rgb(219, 78, 27);
            text-align: center;
            font-size: 40px;
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            background-color: rgb(236, 238, 188);
        }
        H2{
            color: rgb(139, 124, 227);
            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            text-align: center;
            font-size: 30px;
        }
        P{
            color:rgb(224, 144, 155);
            background-color: rgb(187, 245, 223);
            font-family:Georgia, 'Times New Roman', Times, serif;
            text-align: center;
            font-size: 25px;
        } 
        .fonte{
            color: rgb(237, 203, 224);
            background-color: rgb(132, 178, 219);
            text-align: center;
            font-size: 35px;
        }
    </style>
    <!--Define as regras visuais para formatar cores, fontes, tamanhos e alinhamentos de textos-->

<body>
    <!--Contém todo o conteúdo visível da página-->
    <h1>˚.⋆꒰১ Antonella Navarro Fernandes ໒꒱⋆.˚</h1>
    <!--Título principal com o nome da pessoa-->
    <p>- Estudante de Desenvolvimento de Sistemas -</p>
    <!--Parágrafo informativo-->
    <h2 class="fonte">Fã número 1 da Manon! ♡</h2>
    <!--Subtítulo estilizado através da classe-->
    <img src="https://i.pinimg.com/736x/96/14/d6/9614d673bd8d114f6e9ac328a7b37170.jpg"  style="display: block; margin: o auto; width: 300px">
    <img src="https://i.pinimg.com/1200x/56/87/fa/5687fae7cae8ccdebeabf45ab8b0f355.jpg"  style="display: block; margin: o auto; width: 300px">
    <!--Exibe duas imagens carregadas com links da internet-->
</body>
</html>
