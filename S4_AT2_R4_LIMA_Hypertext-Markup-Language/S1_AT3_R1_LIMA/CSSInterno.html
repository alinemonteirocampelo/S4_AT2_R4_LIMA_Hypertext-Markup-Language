<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge";>
    <title>CSS_InLine</title>
        <!--Declaração do CSS Interno-->
    <style>
        H1{
            color: blueviolet;
            text-align: center;
            font-size: 50px;
        }
        H2{
            color: rgb(226, 43, 189);
            text-align: center;
            font-size: 60px;
        }
        P{
            font-size: 40px;
            text-align: center;
        }

        .fonte{
            color: rgb(226, 43, 189);
            text-align: center;
            font-size: 45px;
        }
    </style>

<body>
    <h1>Antonella Navarro Fernandes</h1>
    <p>Estudante de Desenvolvimento de Sistemas</p>
    <p>Lista de cursos</p>
    <h2 class="fonte">Lista de Cursos</h2>

</body>
</html>
